<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogo | IGEA IMPIANTI</title><style>body{margin:0;background:#090d14;color:#f6f8ff;font:16px system-ui}header,main{max-width:1150px;margin:auto;padding:30px 22px}a{color:#8ac5ff}h1{font-size:clamp(36px,7vw,70px);letter-spacing:-.05em}p{color:#aab7c9;line-height:1.6}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}button{background:#17283e;color:white;border:1px solid #365579;padding:12px 16px;border-radius:8px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.item{border:1px solid #26394d;background:#111a27;border-radius:12px;overflow:hidden}.item img{width:100%;aspect-ratio:4/3;object-fit:cover}.item div{padding:20px}.item h2{font-size:21px}.item a{display:inline-block;margin-top:12px}.empty{padding:35px;border:1px solid #304258;border-radius:12px}</style></head><body><header><a href="./index.html">← IGEA IMPIANTI</a></header><main><small>SELEZIONE PROFESSIONALE</small><h1>Il nostro catalogo.</h1><p>Scopri i prodotti selezionati e richiedi una soluzione su misura. Nessun acquisto automatico: ogni richiesta riceve una valutazione personalizzata.</p><div id="filters" class="filters"></div><div id="items" class="grid"><p>Caricamento catalogo…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://wcvocgdsgzovaaxrvyau.supabase.co","sb_publishable_UmT3uKWb57H_3ni9wpG5EA_32hgtLX-");
const el=document.getElementById("items"),filters=document.getElementById("filters");let products=[],categories=[];
function draw(id){el.replaceChildren();const shown=products.filter(p=>!id||p.category_id===id);if(!shown.length){const p=document.createElement("p");p.className="empty";p.textContent="Nessun prodotto pubblicato in questa categoria.";el.append(p);return}shown.forEach(p=>{const card=document.createElement("article");card.className="item";const img=p.images?.[0];if(img&&/^https:\/\//.test(img)){const photo=document.createElement("img");photo.src=img;photo.alt=p.title;photo.loading="lazy";card.append(photo)}const content=document.createElement("div"),title=document.createElement("h2"),desc=document.createElement("p"),link=document.createElement("a");title.textContent=p.title;desc.textContent=p.description||"";link.textContent="Richiedi preventivo";link.href="mailto:shop@igeaimpianti.com?subject="+encodeURIComponent("Preventivo: "+p.title+(p.sku?" ("+p.sku+")":""));content.append(title,desc,link);card.append(content);el.append(card)})}
async function init(){const [c,p]=await Promise.all([db.from("site_categories").select("id,name,parent_id,sort_order").eq("is_visible",true).order("sort_order"),db.from("site_products").select("id,title,description,sku,images,category_id").eq("is_published",true).order("sort_order")]);if(c.error||p.error){el.textContent="Catalogo temporaneamente non disponibile.";return}categories=c.data||[];products=p.data||[];const all=document.createElement("button");all.textContent="Tutti";all.onclick=()=>draw(null);filters.append(all);categories.forEach(cat=>{const b=document.createElement("button");b.textContent=cat.name;b.onclick=()=>draw(cat.id);filters.append(b)});draw(null)}init();
</script></body></html>
