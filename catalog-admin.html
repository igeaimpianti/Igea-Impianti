<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione catalogo IGEA</title><style>body{background:#0c121c;color:white;font:16px system-ui;max-width:850px;margin:auto;padding:24px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;background:#192536;color:white;border:1px solid #40516b;border-radius:8px;font:inherit}button{background:#1766b9;cursor:pointer}label{display:block;margin-top:16px}section{padding:20px;border:1px solid #33465e;border-radius:12px;margin:20px 0}a{color:#83c1ff}.muted{color:#afbdd0}.row{border-top:1px solid #40516b;padding:15px 0}h1{font-size:32px}</style></head><body><a href="./index.html">← Torna al gestionale</a><h1>Catalogo del sito</h1><p class="muted">Gestisci categorie, sottocategorie e prodotti visibili su igeaimpianti.com. I prodotti nuovi restano privati finché non li pubblichi.</p><div id="status">Verifica accesso…</div><div id="panel" hidden><section><h2>Nuova categoria / sottocategoria</h2><form id="categoryForm"><label>Nome<input id="catName" required maxlength="100"></label><label>Categoria superiore<select id="parent"><option value="">Nessuna (categoria principale)</option></select></label><button>Crea categoria</button></form></section><section><h2>Nuovo prodotto</h2><form id="productForm"><label>Titolo<input id="title" required maxlength="180"></label><label>Codice articolo<input id="sku" maxlength="100"></label><label>Categoria<select id="category" required></select></label><label>Descrizione<textarea id="description" rows="5"></textarea></label><label>URL immagini HTTPS (una per riga)<textarea id="images" rows="3" placeholder="https://..."></textarea></label><label><input id="published" type="checkbox" style="width:auto"> Pubblica sul sito</label><button>Salva prodotto</button></form></section><section><h2>Prodotti salvati</h2><div id="saved"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://wcvocgdsgzovaaxrvyau.supabase.co","sb_publishable_UmT3uKWb57H_3ni9wpG5EA_32hgtLX-"),status=document.getElementById("status");let user,categories=[];
async function check(){const {data:{user:u},error}=await db.auth.getUser();if(error||!u){status.textContent="Accedi prima alla PWA IGEA IMPIANTI PRO da questo stesso dominio.";return}user=u;status.textContent="Accesso autenticato";document.getElementById("panel").hidden=false;await refresh()}
async function refresh(){const [c,p]=await Promise.all([db.from("site_categories").select("*").order("sort_order"),db.from("site_products").select("*").order("created_at",{ascending:false})]);if(c.error||p.error){status.textContent="Errore di lettura: "+(c.error||p.error).message;return}categories=c.data||[];const cat=document.getElementById("category"),parent=document.getElementById("parent");cat.replaceChildren();parent.replaceChildren();parent.add(new Option("Nessuna (categoria principale)",""));categories.forEach(x=>{cat.add(new Option(x.name,x.id));parent.add(new Option(x.name,x.id))});const saved=document.getElementById("saved");saved.replaceChildren();(p.data||[]).forEach(x=>{const row=document.createElement("div");row.className="row";const name=document.createElement("strong");name.textContent=x.title+" · "+(x.is_published?"Pubblicato":"Bozza");const toggle=document.createElement("button");toggle.textContent=x.is_published?"Rendi privato":"Pubblica";toggle.onclick=async()=>{const {error}=await db.from("site_products").update({is_published:!x.is_published}).eq("id",x.id).eq("user_id",user.id);status.textContent=error?error.message:"Prodotto aggiornato";if(!error)await refresh()};row.append(name,toggle);saved.append(row)})}
document.getElementById("categoryForm").onsubmit=async e=>{e.preventDefault();const name=document.getElementById("catName").value.trim(),parent_id=document.getElementById("parent").value||null;const slug=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);const {error}=await db.from("site_categories").insert({name,slug,parent_id,user_id:user.id});status.textContent=error?error.message:"Categoria salvata";if(!error){e.target.reset();await refresh()}};
document.getElementById("productForm").onsubmit=async e=>{e.preventDefault();const images=document.getElementById("images").value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(images.some(x=>!/^https:\/\//.test(x))){status.textContent="Le immagini devono avere URL HTTPS validi.";return}const payload={user_id:user.id,title:document.getElementById("title").value.trim(),sku:document.getElementById("sku").value.trim(),category_id:document.getElementById("category").value,description:document.getElementById("description").value,images,is_published:document.getElementById("published").checked};const {error}=await db.from("site_products").insert(payload);status.textContent=error?error.message:"Prodotto salvato";if(!error){e.target.reset();await refresh()}};check();
</script></body></html>
